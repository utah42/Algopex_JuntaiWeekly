<style>
:root {
  --bg: #e8eef4;
  --surface: #f7fafc;
  --ink: #102033;
  --muted: #5b6c7d;
  --line: #c5d2de;
  --brand: #0a3d5c;
  --accent: #c45c26;
  --up: #1f7a4d;
  --down: #b42318;
  --net: #1a8a7a;
  --input: #8e44ad;
  --pos: #2980b9;
  --off: #e67e22;
  --oth: #c0392b;
  --idle: #1e2a44;
  --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); color: var(--ink);
  background: linear-gradient(180deg, #d5e3ef, var(--bg));
  min-height: 100vh; line-height: 1.5;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 1rem 2.5rem; }
.sticky-head {
  position: sticky; top: 0; z-index: 40;
  margin: 0 0 1rem;
  padding: .15rem .05rem .75rem;
  background: linear-gradient(180deg, rgba(232,238,244,.98), rgba(247,250,252,.96));
  backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: 0 6px 18px rgba(16, 32, 51, .06);
  max-height: min(72vh, 640px);
  overflow-y: auto;
}
.sticky-head .head-row,
.sticky-head h2,
.sticky-head .pills,
.sticky-head .kpis {
  padding-left: 1.05rem;
  padding-right: 1.05rem;
}
.sticky-head .head-row { padding-top: .5rem; }
.sticky-head .kpis { padding-bottom: .15rem; }
.sticky-head h2 {
  color: var(--brand);
  font-size: 1.02rem;
  font-weight: 700;
  margin: 0 0 .35rem;
}
.head-row {
  display: flex; justify-content: space-between; align-items: center; gap: .75rem;
  flex-wrap: nowrap; padding: .65rem 0 .45rem;
  border-bottom: 1px solid var(--line); margin-bottom: .5rem;
}
.head-left {
  display: flex; align-items: baseline; gap: .65rem; min-width: 0; flex: 1;
  white-space: nowrap; overflow: hidden;
}
h1 {
  color: var(--brand); font-size: clamp(1.05rem, 2.2vw, 1.4rem);
  margin: 0; line-height: 1.2; flex-shrink: 0;
}
.lede {
  color: var(--muted); font-size: .82rem; margin: 0;
  overflow: hidden; text-overflow: ellipsis;
}
.head-actions {
  display: flex; align-items: center; gap: .45rem; flex-shrink: 0;
}
.head-legend {
  display: inline-flex; align-items: center; gap: .35rem;
}
.head-legend .delta { margin: 0; cursor: default; }
.head-actions a {
  color: var(--brand); font-size: .78rem; text-decoration: none;
  padding: .26rem .55rem; border: 1px solid var(--line); border-radius: 3px; background: #fff;
}
.head-actions button {
  border: 1px solid var(--brand); background: var(--brand); color: #fff; border-radius: 3px;
  padding: .26rem .6rem; font: inherit; font-size: .74rem; cursor: pointer; font-weight: 600;
}
.head-actions button:hover { background: #0c4d72; }
.head-actions a:hover { background: #e8eef4; }
.pills { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 .55rem; }
.pill {
  display: inline-flex; align-items: center; gap: .35rem;
  border: 1px solid var(--line); border-radius: 999px; padding: .22rem .62rem;
  background: #fff; font-size: .74rem; cursor: pointer; color: var(--muted);
}
.pill.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.pill input { display: none; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-bottom: 0; }
.kpi {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: .65rem .8rem;
}
.kpi .label,
.mini .k {
  font-size: 1.02rem;
  font-weight: 700;
  color: var(--brand);
  letter-spacing: 0;
  text-transform: none;
  background: none;
  padding: 0;
  border-radius: 0;
}
.kpi .value {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--brand);
  font-variant-numeric: tabular-nums;
  margin: .1rem 0;
}
.kpi .meta { font-size: .74rem; color: var(--muted); }
.delta {
  display: inline-flex; align-items: center; gap: .2rem;
  padding: .18rem .45rem;
  border-radius: 999px; font-size: .72rem; font-weight: 700;
  font-variant-numeric: tabular-nums; line-height: 1.2;
  background: #e8eef4; color: var(--muted);
}
.delta.up {
  color: #0f5c38; background: #d8f3e3; box-shadow: inset 0 0 0 1px #9fd4b5;
}
.delta.down {
  color: #8f1d14; background: #fde2df; box-shadow: inset 0 0 0 1px #efb0a8;
}
.delta.flat {
  color: #445566; background: #e8eef4; box-shadow: inset 0 0 0 1px #c5d2de;
}
.kpi .delta, .mini .delta { margin-top: .28rem; }
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  padding: 1rem 1.05rem; margin-bottom: 1rem;
}
.panel h2 { color: var(--brand); font-size: 1.02rem; margin-bottom: .35rem; }
.panel .hint { font-size: .8rem; color: var(--muted); margin-bottom: .6rem; }
.mini-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; margin-bottom: .75rem; }
.mini {
  border: 1px solid var(--line); border-radius: 3px; padding: .55rem .6rem; background: #fff;
}
.mini.chg {
  border-color: #6b7280;
  background: #f3f4f6;
}
.mini.chg .k { color: var(--brand); }
.mini.chg .v { color: #4b5563; }
.mini .v { font-size: 1.05rem; font-weight: 700; color: var(--brand); font-variant-numeric: tabular-nums; }
.mini .d { font-size: .72rem; }
.mini .d .delta { margin-top: .2rem; }
.chart-box { position: relative; height: 300px; }
.chart-box.tall { height: 360px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-bottom: .55rem; }
.seg button {
  border: 0; background: transparent; padding: .32rem .7rem; cursor: pointer;
  font: inherit; font-size: .78rem; color: var(--muted);
}
.seg button.on { background: var(--brand); color: #fff; }
table {
  width: 100%; border-collapse: collapse; font-size: .8rem;
  table-layout: fixed;
}
th, td { padding: .4rem .45rem; border-bottom: 1px solid var(--line); vertical-align: middle; text-align: center; }
th { color: var(--muted); font-size: .68rem; text-transform: uppercase; background: #edf2f7; }
th.num, td.num { text-align: center; font-variant-numeric: tabular-nums; }
td.cutter { text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tbody tr:nth-child(odd) { background: #ffffff; }
tbody tr:nth-child(even) { background: #eef4f9; }
tbody tr:hover { background: #e2edf6; }
col.c-cutter { width: 22%; }
col.c-num { width: 13%; }
@media (max-width: 900px) {
  .kpis, .mini-kpis { grid-template-columns: 1fr 1fr; }
  .chart-box, .chart-box.tall { height: 270px; }
}
@media (max-width: 560px) {
  .kpis, .mini-kpis { grid-template-columns: 1fr; }
}
.improve-section { margin-top: 0; }
.improve-cards {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem;
}
.improve-card {
  background: #fff; border: 1px solid var(--line); border-radius: 4px;
  border-top: 3px solid var(--accent); padding: .85rem .9rem;
}
.improve-card h3 {
  color: var(--brand); font-size: .88rem; margin-bottom: .55rem;
}
.improve-card ul {
  margin: 0; padding-left: 1.15rem; color: var(--ink);
  font-size: .82rem; line-height: 1.55;
}
.improve-card li { margin-bottom: .4rem; }
.improve-card li:last-child { margin-bottom: 0; }
.improve-card .placeholder {
  color: var(--muted); font-size: .82rem; font-style: italic; min-height: 3.2rem; margin: 0;
}
@media (max-width: 900px) {
  .improve-cards { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .improve-cards { grid-template-columns: 1fr; }
}
.footer {

  padding-top: .75rem;
  border-top: 1px dashed var(--line);
  font-size: .7rem;
  color: var(--muted);
  line-height: 1.45;
}
body.is-printing .chart-box,
body.is-printing .chart-box.tall {

  max-height: 360px !important;

}
body.is-printing .chart-box canvas {

  height: 100% !important;
  max-height: 360px !important;
}
body.is-printing .kpis {

body.is-printing .mini-kpis {

  grid-template-columns: repeat(4, 1fr) !important;

  }
  .mini { padding: .3rem .35rem; min-width: 0; }

  }
  .chart-box canvas {

    width: 100% !important;
    height: 100% !important;
    max-height: 360px !important;
  }
  .improve-section { break-inside: avoid; }
  .improve-cards {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: .35rem;
  }
  .improve-card { padding: .4rem .45rem; }
  .improve-card h3 { font-size: .72rem; margin-bottom: .2rem; }
  .improve-card ul { font-size: .62rem; line-height: 1.35; }
  .improve-card li { margin-bottom: .15rem; }
  .footer {
    flex: 0 0 auto;
    margin-top: auto;
    padding: .4rem .15rem 0;
    border-top: 1px solid var(--line);
    font-size: .52rem;
    line-height: 1.3;
    color: #5b6c7d;
  }
}
</style>

const state = {
  selected: {},
  charts: {}
};

function destroyChart(key) {
  if (state.charts[key]) { state.charts[key].destroy(); state.charts[key] = null; }
}

function selectedCutters() {
  return DATA.cutters.map(c => c.id).filter(id => state.selected[id]);
}

function filterRows(rows) {
  const sel = new Set(selectedCutters());
  return rows.filter(r => sel.has(r.cutter));
}

function enrichDay(rows, hAvail, inputPer) {
  const byDay = {};
  rows.forEach(r => {
    if (!byDay[r.day]) byDay[r.day] = { day: r.day, cutters: new Set(), perimeter_m: 0, material_m: 0, net_h: 0, pos_h: 0, off_h: 0, oth_h: 0, chg_h: 0, speeds: [], mu_pcts: [] };
    const d = byDay[r.day];
    d.cutters.add(r.cutter);
    d.perimeter_m += r.perimeter_m;
    d.material_m += r.material_m;
    d.net_h += r.net_h;
    d.pos_h += r.pos_h;
    d.off_h += r.off_h;
    d.oth_h += r.oth_h;
    d.chg_h += (r.chg_h || 0);
    if (r.speed != null && r.net_h > 0) d.speeds.push(r.speed);
    if (r.mu_pct != null && !Number.isNaN(r.mu_pct)) d.mu_pcts.push(r.mu_pct);
  });
  return Object.keys(byDay).sort().map(day => {
    const d = byDay[day];
    const n = d.cutters.size;
    const input_h = n * inputPer;
    const speed = d.speeds.length ? d.speeds.reduce((a,b)=>a+b,0)/d.speeds.length : null;
    const muFromGold = d.mu_pcts.length > 0;
    const mu = muFromGold ? d.mu_pcts.reduce((a,b)=>a+b,0)/d.mu_pcts.length
      : (n * hAvail > 0 ? 100 * d.net_h / (n * hAvail) : null);
    const avail = (mu != null && mu > 0) ? d.net_h / (mu / 100) : n * hAvail;
    const idle_h = Math.max(0, avail - d.net_h - input_h - d.pos_h - d.off_h - d.oth_h);
    return {
      day, n, avail_h: avail, input_h, idle_h,
      net_h: d.net_h, pos_h: d.pos_h, off_h: d.off_h, oth_h: d.oth_h, chg_h: d.chg_h,
      material_m: d.material_m, perimeter_m: d.perimeter_m, speed, mu, mu_from_gold: muFromGold
    };
  });
}

function aggPeriod(rows) {
  const days = enrichDay(rows, DATA.config.h_avail, DATA.config.input_h_per_cutter_day);
  if (!days.length) {
    return { days: [], material_m: 0, net_h: 0, pos_h: 0, off_h: 0, oth_h: 0, chg_h: 0, input_h: 0, idle_h: 0, avail_h: 0, mu: null, speed: null, active_days: 0 };
  }
  const sum = (k) => days.reduce((a,d)=>a+d[k],0);
  const speeds = days.map(d => d.speed).filter(v => v != null);
  const mus = days.map(d => d.mu).filter(v => v != null);
  const avail = sum("avail_h");
  const net = sum("net_h");
  // Match Python weekly_mu_weighted: only days with Algopex gold MU (skip fallback).
  let muWeighted = null;
  {
    let netFromMu = 0;
    let availFromMu = 0;
    days.forEach(d => {
      if (d.mu_from_gold && d.mu != null && d.mu > 0 && d.net_h > 0) {
        netFromMu += d.net_h;
        availFromMu += d.net_h / (d.mu / 100);
      }
    });
    if (availFromMu > 0) muWeighted = 100 * netFromMu / availFromMu;
  }
  return {
    days,
    material_m: sum("material_m"),
    net_h: net,
    pos_h: sum("pos_h"),
    off_h: sum("off_h"),
    oth_h: sum("oth_h"),
    chg_h: sum("chg_h"),
    input_h: sum("input_h"),
    idle_h: sum("idle_h"),
    avail_h: avail,
    mu: muWeighted != null ? muWeighted : (avail > 0 ? 100 * net / avail : null),
    speed: speeds.length ? speeds.reduce((a,b)=>a+b,0)/speeds.length : null,
    active_days: days.length
  };
}

function monthDailyAvg(monthRows) {
  const days = enrichDay(monthRows, DATA.config.h_avail, DATA.config.input_h_per_cutter_day);
  if (!days.length) return null;
  const n = days.length;
  const avg = (k) => days.reduce((a,d)=>a+d[k],0) / n;
  const speeds = days.map(d => d.speed).filter(v => v != null);
  const mus = days.map(d => d.mu).filter(v => v != null);
  return {
    material_m: avg("material_m"),
    net_h: avg("net_h"),
    pos_h: avg("pos_h"),
    off_h: avg("off_h"),
    oth_h: avg("oth_h"),
    chg_h: avg("chg_h"),
    input_h: avg("input_h"),
    idle_h: avg("idle_h"),
    mu: (() => {
      let netFromMu = 0;
      let availFromMu = 0;
      days.forEach(d => {
        if (d.mu_from_gold && d.mu != null && d.mu > 0 && d.net_h > 0) {
          netFromMu += d.net_h;
          availFromMu += d.net_h / (d.mu / 100);
        }
      });
      if (availFromMu > 0) return 100 * netFromMu / availFromMu;
      return mus.length ? mus.reduce((a,b)=>a+b,0)/mus.length : null;
    })(),
    speed: speeds.length ? speeds.reduce((a,b)=>a+b,0)/speeds.length : null,
    active_days: n
  };
}

function fmt(v, digits) {
  if (v == null || Number.isNaN(v)) return "—";
  return Number(v).toFixed(digits);
}

const WEEKDAY_ZH = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
function dayAxisLabel(isoDay) {
  const [y, m, d] = isoDay.split("-").map(Number);
  const wd = WEEKDAY_ZH[new Date(y, m - 1, d).getDay()];
  return `${isoDay.slice(5)} ${wd}`;
}

function addDaysIso(isoDay, n) {
  const [y, m, d] = isoDay.split("-").map(Number);
  const dt = new Date(y, m - 1, d + n);
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const dd = String(dt.getDate()).padStart(2, "0");
  return `${dt.getFullYear()}-${mm}-${dd}`;
}

function emptyChartDay(isoDay) {
  return {
    day: isoDay, n: 0, avail_h: 0, input_h: 0, idle_h: 0,
    net_h: 0, pos_h: 0, off_h: 0, oth_h: 0, chg_h: 0,
    material_m: 0, perimeter_m: 0, speed: null, mu: null, placeholder: true
  };
}

function padWeekChartDays(days) {
  const start = DATA.week_start;
  const byDay = {};
  (days || []).forEach(d => { byDay[d.day] = d; });
  const out = [];
  for (let i = 0; i < 7; i++) {
    const iso = addDaysIso(start, i);
    out.push(byDay[iso] || emptyChartDay(iso));
  }
  return out;
}

function deltaHtml(cur, base, digits, unit, label = "对比上周", lowerBetter = false) {
  if (cur == null || base == null || base === 0) {
    return `<span class="delta flat">${label} —</span>`;
  }
  const d = cur - base;
  const pct = 100 * d / Math.abs(base);
  // Direction of change (arrow) vs whether the change is "good" (color).
  const rose = d > 0.0001;
  const fell = d < -0.0001;
  const good = lowerBetter ? fell : rose;
  const bad = lowerBetter ? rose : fell;
  const cls = good ? "up" : (bad ? "down" : "flat");
  const arrow = rose ? "▲" : (fell ? "▼" : "●");
  const sign = d > 0 ? "+" : "";
  const u = unit ? ` ${unit}` : "";
  // KPI 升降统一用 percentage points 口径
  if (unit === "pp") {
    return `<span class="delta ${cls}">${arrow} ${label} ${sign}${d.toFixed(digits)}${u}</span>`;
  }
  return `<span class="delta ${cls}">${arrow} ${label} ${sign}${d.toFixed(digits)}${u}（${sign}${pct.toFixed(1)} pp）</span>`;
}

function initSelection() {
  (DATA.cutters || []).forEach(c => { state.selected[c.id] = true; });
}

    } else {

    }
    const unitSuffix = c.unit.trim();
    const deltaUnit = unitSuffix === "%" ? "pp" : unitSuffix;
    return `<div class="kpi">
      <div class="label">${c.label}</div>
      <div class="value">${fmt(c.cur, c.digits)}</div>
      <div class="meta">${monthLabel}</div>
      <div class="meta">${deltaHtml(c.cur, c.prev, c.digits, deltaUnit, "对比上周")}</div>
      <div class="meta">${deltaHtml(c.cur, c.month, c.digits, deltaUnit, "对比上月")}</div>
    </div>`;
  }).join("");
}

function renderTimeKpis(week, monthAvg, prev) {
  const items = [
    { k: "net_h", label: "净裁剪 (h)", dig: 1, lowerBetter: false },
    { k: "pos_h", label: "定位 (h)", dig: 1, lowerBetter: true },
    { k: "off_h", label: "卸料 (h)", dig: 1, lowerBetter: true },
    { k: "chg_h", label: "换床 (h)", dig: 1, lowerBetter: true, accent: true }
  ];
  const getW = (k) => week[k];
  const getP = (k) => (prev ? prev[k] : null);
  const getM = (k) => (monthAvg ? monthAvg[k] : null);
  document.getElementById("timeKpis").innerHTML = items.map(it => {
    const cur = getW(it.k);
    const m = getM(it.k);
    const monthEq = m == null ? null : m * (week.active_days || 1);
    const cls = it.accent ? "mini chg" : "mini";
    return `<div class="${cls}">
      <div class="k">${it.label}</div>
      <div class="v">${fmt(cur, it.dig)}</div>
      <div class="d">上月日均 ${fmt(m, it.dig)} h</div>
      <div class="d">${deltaHtml(cur, getP(it.k), it.dig, "h", "对比上周", it.lowerBetter)}</div>
      <div class="d">${deltaHtml(cur, monthEq, it.dig, "h", "对比上月", it.lowerBetter)}</div>
    </div>`;
  }).join("");
}

function pctOfAvail(val, avail) {
  if (avail == null || avail <= 0 || val == null || val <= 0) return null;
  return 100 * val / avail;
}

function stackPctLabelPlugin(days) {
  const specs = [
    { ds: 0, key: "net_h" },
    { ds: 1, key: "pos_h" },
    { ds: 2, key: "off_h" }
  ];
  return {
    id: "stackPctLabels",
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      specs.forEach(({ ds, key }) => {
        const meta = chart.getDatasetMeta(ds);
        if (meta.hidden) return;
        meta.data.forEach((bar, i) => {
          const day = days[i];
          if (!day) return;
          const pct = pctOfAvail(day[key], day.avail_h);
          if (pct == null || pct < 3) return;
          const top = Math.min(bar.y, bar.base);
          const h = Math.abs(bar.base - bar.y);
          if (h < 13) return;
          ctx.save();
          ctx.font = "600 10px Segoe UI, PingFang SC, Microsoft YaHei, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "rgba(0,0,0,0.45)";
          ctx.shadowBlur = 2;
          ctx.fillText(`${pct.toFixed(0)}%`, bar.x, top + h / 2);
          ctx.restore();
        });
      });
    }
  };
}

function renderTimeStack(week) {
  destroyChart("stack");
  const days = padWeekChartDays(week.days);
  const labels = days.map(d => dayAxisLabel(d.day));
  state.charts.stack = new Chart(document.getElementById("chartTimeStack"), {
    type: "bar",
    data: {
      labels,
      datasets: [
        { label: "净裁剪 (h)", data: days.map(d => d.net_h), backgroundColor: "#1a8a7a", stack: "t" },
        { label: "定位 (h)", data: days.map(d => d.pos_h), backgroundColor: "#2980b9", stack: "t" },
        { label: "卸料 (h)", data: days.map(d => d.off_h), backgroundColor: "#e67e22", stack: "t" },
        { label: "Other (h)", data: days.map(d => d.oth_h), backgroundColor: "#c0392b", stack: "t" },
        { label: "换床 (h)", data: days.map(d => d.chg_h), backgroundColor: "#6b7280", stack: "t" }
      ]
    },
    plugins: [stackPctLabelPlugin(days)],
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 } } },
        y: { stacked: true, title: { display: true, text: "工时 (h)" } }
      }
    }
  });
}

function renderAll() {
  const weekRows = filterRows(DATA.week_rows);
  const prevRows = filterRows(DATA.prev_rows || []);
  const monthRows = filterRows(DATA.month_rows || []);
  const week = aggPeriod(weekRows);
  const prev = prevRows.length ? aggPeriod(prevRows) : null;
  const monthAvg = monthRows.length ? monthDailyAvg(monthRows) : null;

  renderMainKpis(week, monthAvg, prev);
  renderTimeKpis(week, monthAvg, prev);
  renderTimeStack(week);

  const cutterLabel = (DATA.cutters && DATA.cutters[0]) ? (DATA.cutters[0].name || DATA.cutters[0].id) : "FC25JN6929";
  const muNote = (DATA.config.mu_source === "algopex_machine_use")
    ? `稼动率%=Algopex Machine Use（${DATA.config.mu_gold_file || "machine_use_daily.json"}，日度柱顶值）；周/月 MU=100×Σnet÷Σavailable（与 Summary 周柱一致）；`
    : `稼动率%=100×净裁剪/Available，Available=活跃机台日×${DATA.config.h_avail}h；`;
  document.getElementById("footerNote").innerHTML =
    `单机台 ${cutterLabel}。口径：不过滤 Reliable/Completed；速度=日均；产量=Σ Cut Material Length (m)；` +
    muNote +
    `Available 由 MU 反推（Net÷MU%）；Input≈${DATA.config.input_h_per_cutter_day}h/机/日（估算）；Idle=Available−净裁剪−Input−定位−卸料−Other。` +
    `上月日均基准=${DATA.month_ym}` +
    (DATA.week_month_ym ? `（本周所属月 ${DATA.week_month_ym}）` : ``) +
    `。数据源：${(DATA.sources||[]).join(" · ")}`;
}

initSelection();
renderAll();

function resizeCharts() {
  Object.keys(state.charts).forEach((key) => {
    const chart = state.charts[key];
    if (chart) chart.resize();
  });
}

window.addEventListener("beforeprint", () => {
  if (!document.body.dataset.prevTitle) {
    document.body.dataset.prevTitle = document.title;
  }
  const isoTag = String(DATA.iso_key || "").replace("-", "");
  document.title = `骏泰力克裁床生产周报${isoTag}`;
  document.body.classList.add("is-printing");
  resizeCharts();
});
window.addEventListener("afterprint", () => {
  document.body.classList.remove("is-printing");
  if (document.body.dataset.prevTitle) {
    document.title = document.body.dataset.prevTitle;
    delete document.body.dataset.prevTitle;
  }
  resizeCharts();
});

document.getElementById("btnExportPdf").addEventListener("click", () => {
  document.body.dataset.prevTitle = document.title;
  const isoTag = String(DATA.iso_key || "").replace("-", "");
  document.title = `骏泰力克裁床生产周报${isoTag}`;
  document.body.classList.add("is-printing");
  resizeCharts();
  requestAnimationFrame(() => {
    setTimeout(() => {
      window.print();
    }, 120);
  });
});
</script>
